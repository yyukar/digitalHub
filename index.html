<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yusuf Yukar — Links</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f3f5f7;
        color: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      h1 {
        font-size: 2.8rem;
        font-weight: 700;
        margin-bottom: 40px;
        text-align: center;
      }
      .underline {
        width: 75px;
        height: 3px;
        background: #111;
        border-radius: 4px;
        margin-bottom: 32px;
      }
      .links {
        width: 90%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .link-btn {
        display: block;
        text-align: center;
        padding: 14px 20px;
        background: #ffffff;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 500;
        text-decoration: none;
        color: #111;
        border: 1px solid #e1e1e1;
        transition: all 0.25s ease;
      }
      .link-btn:hover {
        background: #eaecee;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <h1>Yusuf Yukar</h1>
    <div class="underline"></div>
    <div class="links">
      <a
        class="link-btn"
        href="https://instagram.com/yukaryusuf/"
        target="_blank"
        >Instagram</a
      >
      <a class="link-btn" href="https://x.com/yusufyukar/" target="_blank"
        >Twitter / X</a
      >
      <a class="link-btn" href="https://www.youtube.com/@yyukar" target="_blank"
        >YouTube</a
      >
      <a
        class="link-btn"
        href="https://www.linkedin.com/in/yusufyukar/"
        target="_blank"
        >Linkedin</a
      >
      <a class="link-btn" href="https://github.com/yyukar" target="_blank"
        >GitHub</a
      >
      <a class="link-btn" href="https://medium.com/@yusufyukar" target="_blank"
        >Medium</a
      >
      <a class="link-btn" href="https://steamcommunity.com/id/yyukar" target="_blank"
        >Steam</a
      >

    </div>
  </body>
</html>
