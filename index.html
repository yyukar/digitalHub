    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f3f5f7;
        color: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      h1 {
        font-size: 2.8rem;
        font-weight: 700;
        margin-bottom: 40px;
        text-align: center;
      }
      .underline {
        width: 75px;
        height: 3px;
        background: #111;
        border-radius: 4px;
        margin-bottom: 32px;
      }
      .links {
        width: 90%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .link-btn {
        display: block;
        text-align: center;
        padding: 14px 20px;
        background: #ffffff;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 500;
        text-decoration: none;
        color: #111;
        border: 1px solid #e1e1e1;
        transition: all 0.25s ease;
      }
      .link-btn:hover {
        background: #eaecee;
        transform: translateY(-2px);
      }

      >
